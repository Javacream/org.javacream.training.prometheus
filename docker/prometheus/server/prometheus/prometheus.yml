global:
  scrape_interval:     15s 

scrape_configs:

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'Linux Node'
    static_configs:
      - targets: ['javacream.eu:9100']

  - job_name: 'Linux Deskmate'
    static_configs:
      - targets: ['10.160.1.14:9100']
